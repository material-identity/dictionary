# Draft for dictionary request #87 — id is a placeholder until minted at publication.
id: https://material-identity.eu/def/00000000-0000-4000-8000-000000000000
isDefinedBy: https://material-identity.eu/
objectType: Value
value: remanufacturer
preferredName:
  en: Remanufacturer
  de: Wiederaufarbeitungsbetrieb
definition:
  en: Natural or legal person that carries out remanufacturing — actions through which a new product is produced from objects that are waste, products or components, with at least one change that substantially affects the safety, performance, purpose or type of the product.
  de: Natürliche oder juristische Person, die Wiederaufarbeitungen durchführt — Maßnahmen, durch die aus Gegenständen, bei denen es sich um Abfälle, Produkte oder Bauteile handelt, ein neues Produkt hergestellt wird und bei denen mindestens eine Änderung vorgenommen wird, die die Sicherheit, Leistung, Zweckbestimmung oder Art des Produkts wesentlich beeinflusst.
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 2(16); Art. 11(b)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
