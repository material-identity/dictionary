value: marketSurveillanceAuthority
preferredName:
  en: Market surveillance authority
  de: Marktüberwachungsbehörde
definition:
  en: Authority designated by a Member State as responsible for carrying out market surveillance in its territory.
  de: Von einem Mitgliedstaat benannte Behörde, die für die Durchführung der Marktüberwachung in seinem Hoheitsgebiet zuständig ist.
