isDefinedBy: https://material-identity.eu/
objectType: MultiValuedDataElement
shortName: substanceOtherNames
preferredName:
  en: Other substance names
  de: Andere Stoffbezeichnungen
definition:
  en: Names other than the IUPAC or international name under which the substance
    is known, including usual names, trade names and abbreviations.
  de: Andere Bezeichnungen als die IUPAC- oder internationale Bezeichnung, unter
    denen der Stoff bekannt ist, einschließlich allgemeiner Bezeichnungen,
    Handelsnamen und Abkürzungen.
