id: https://material-identity.eu/def/f92b1603-6e27-4933-be7a-8c46128f553b
isDefinedBy: https://material-identity.eu/
objectType: Value
value: customsAuthority
preferredName:
  en: Customs authority
  de: Zollbehörde
definition:
  en: Customs administration of a Member State responsible for applying customs legislation, or any other authority empowered under national law to apply certain customs legislation.
  de: Zollverwaltung eines Mitgliedstaats, die für die Anwendung der zollrechtlichen Vorschriften zuständig ist, oder jede andere Behörde, die nach nationalem Recht zur Anwendung bestimmter zollrechtlicher Vorschriften befugt ist.
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 11(b); defined in Regulation (EU) 2019/1020 Art. 3(24) via Regulation (EU) No 952/2013 Art. 5(1)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
