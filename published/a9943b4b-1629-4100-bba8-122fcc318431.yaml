id: https://material-identity.eu/def/a9943b4b-1629-4100-bba8-122fcc318431
isDefinedBy: https://material-identity.eu/
objectType: Quantity
shortName: carbonFootprintIntensity
preferredName:
  en: carbon footprint intensity
  de: spezifischer CO2-Fußabdruck
definition:
  en: Carbon footprint of a product expressed per unit mass of the product, as
    mass of carbon dioxide equivalents per mass of product.
  de: Auf die Masseneinheit des Produkts bezogener CO2-Fußabdruck, angegeben als
    Masse an CO2-Äquivalenten je Masse des Produkts.
dimension: "1"
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 2(25)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
