id: https://material-identity.eu/def/7970bd8c-3a53-4135-b4b6-942692dca107
isDefinedBy: https://material-identity.eu/
objectType: Value
value: recycler
preferredName:
  en: Recycler
  de: Recyclingbetrieb
definition:
  en: Natural or legal person that carries out recycling — recovery operations by which waste materials are reprocessed into products, materials or substances, whether for the original or other purposes.
  de: Natürliche oder juristische Person, die Recycling durchführt — Verwertungsverfahren, durch die Abfallmaterialien zu Produkten, Materialien oder Stoffen für den ursprünglichen Zweck oder für andere Zwecke aufbereitet werden.
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 11(b); recycling as defined in Directive 2008/98/EC Art. 3(17), imported by Art. 2
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
