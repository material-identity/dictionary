shortName: substanceConcentration
preferredName:
  en: Concentration of the substance
  de: Konzentration des Stoffes
definition:
  en: Statement of the concentration, maximum concentration or concentration range
    of the substance of concern at the level of the product, expressed as a mass
    fraction.
  de: Angabe der Konzentration, der Höchstkonzentration oder des
    Konzentrationsbereichs des besorgniserregenden Stoffes auf Ebene des
    Produkts, ausgedrückt als Massenanteil.
legalBasis:
