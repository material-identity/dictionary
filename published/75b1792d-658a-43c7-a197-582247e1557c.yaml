value: concentrationRange
preferredName:
  en: Concentration range
  de: Konzentrationsbereich
definition:
  en: The stated values are the lower and upper limits of the range within which
    the concentration of the substance lies.
  de: Die angegebenen Werte sind die Unter- und Obergrenze des Bereichs, in dem
    die Konzentration des Stoffes liegt.
