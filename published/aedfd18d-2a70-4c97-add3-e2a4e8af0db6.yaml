id: https://material-identity.eu/def/aedfd18d-2a70-4c97-add3-e2a4e8af0db6
isDefinedBy: https://material-identity.eu/
objectType: SingleValuedDataElement
shortName: gtin
preferredName:
  en: Global Trade Item Number (GTIN)
  de: Globale Artikelnummer (GTIN)
definition:
  en: GS1 identification key, of 8, 12, 13 or 14 digits including a check digit,
    that identifies the product as a trade item.
  de: GS1-Identifikationsschlüssel mit 8, 12, 13 oder 14 Ziffern einschließlich
    Prüfziffer, der das Produkt als Handelseinheit identifiziert.
valueDataType: xsd:string
exampleValue: "04012345000016"
definitionStandard:
  name: GS1 General Specifications
  clause: AI (01), 3.3.2
  uri: https://ref.gs1.org/standards/genspecs/26.0.0/
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Annex III(c)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
