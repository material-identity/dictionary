definition:
  en: One substance of concern present in the product, identified by name and
    numerical codes, with its location within the product and its concentration.
  de: Ein im Produkt enthaltener besorgniserregender Stoff, identifiziert durch
    Namen und numerische Kennungen, mit seinem Ort im Produkt und seiner
    Konzentration.
