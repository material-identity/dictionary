  clause: 7.8.1.1 b)
  uri: urn:iso:std:iso:14021:ed-2
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 5(1)(k); Annex I(h)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
