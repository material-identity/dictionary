id: https://material-identity.eu/def/49a9e89f-5843-4ae1-ac7a-26df894c73db
isDefinedBy: https://material-identity.eu/
objectType: SingleValuedDataElement
shortName: preConsumerRecycledContent
preferredName:
  en: Pre-consumer recycled content
  de: Rezyklatanteil aus Pre-Consumer-Material
definition:
  en: Proportion, by mass, of the product that is pre-consumer material, being
    material diverted from the waste stream during a manufacturing process,
    excluding rework, regrind or scrap capable of being reclaimed within the
    same process that generated it.
  de: Massenbezogener Anteil des Produkts an Pre-Consumer-Material, d. h. an
    Material, das während eines Herstellungsprozesses aus dem Abfallstrom
    abgezweigt wurde, ausgenommen Nacharbeit, Mahlgut oder Schrott, die im
    selben Prozess, in dem sie entstanden sind, wiederverwertet werden können.
valueDataType: xsd:decimal
unit: https://material-identity.eu/def/77c9abeb-120d-4425-8972-492e33c7c659
quantityKind: https://material-identity.eu/def/669faab7-05d5-49bf-8584-d172c7fce713
definitionStandard:
