objectType: DataElementCollection
shortName: importerInformation
preferredName:
  en: Importer information
  de: Angaben zum Importeur
definition:
  en: Name, contact details and customs registration number by which the importer
    of the product can be identified and contacted.
  de: Name, Kontaktdaten und zollrechtliche Registriernummer, anhand derer der
    Importeur des Produkts identifiziert und kontaktiert werden kann.
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 29(3); Annex III(j)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
