objectType: SingleValuedDataElement
shortName: concentrationValue
preferredName:
  en: Concentration value
  de: Konzentrationswert
definition:
  en: Mass fraction of the substance in the product, being the concentration or
    the maximum concentration as indicated by the concentration descriptor, or
    the lower limit where a concentration range is stated.
  de: Massenanteil des Stoffes im Produkt, d. h. die Konzentration oder die
    Höchstkonzentration gemäß der Art der Konzentrationsangabe oder, bei Angabe
    eines Konzentrationsbereichs, dessen Untergrenze.
valueDataType: xsd:decimal
