id: https://material-identity.eu/def/bfb61d33-65fd-44da-9766-82d74f5348f9
isDefinedBy: https://material-identity.eu/
objectType: SingleValuedDataElement
shortName: postConsumerRecycledContent
preferredName:
  en: Post-consumer recycled content
  de: Rezyklatanteil aus Post-Consumer-Material
definition:
  en: Proportion, by mass, of the product that is post-consumer material, being
    material generated by households or by commercial, industrial and
    institutional facilities in their role as end-users of the product that can
    no longer be used for its intended purpose, including returns of material
    from the distribution chain.
  de: Massenbezogener Anteil des Produkts an Post-Consumer-Material, d. h. an
    Material aus Haushalten oder aus gewerblichen, industriellen und
    institutionellen Einrichtungen in ihrer Rolle als Endnutzer des Produkts,
    das nicht mehr bestimmungsgemäß verwendet werden kann, einschließlich
    Materialrückläufen aus der Vertriebskette.
valueDataType: xsd:decimal
unit: https://material-identity.eu/def/77c9abeb-120d-4425-8972-492e33c7c659
quantityKind: https://material-identity.eu/def/669faab7-05d5-49bf-8584-d172c7fce713
