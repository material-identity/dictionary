definition:
  en: List of the substances of concern present in the product that are subject to
    the information requirement, each identified with its location and
    concentration.
  de: Liste der im Produkt enthaltenen besorgniserregenden Stoffe, die der
    Informationsanforderung unterliegen, jeweils mit Angabe ihres Ortes im
    Produkt und ihrer Konzentration.
