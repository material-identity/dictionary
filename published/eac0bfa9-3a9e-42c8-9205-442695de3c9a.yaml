shortName: steelmakingRoute
preferredName:
  en: Steelmaking route
  de: Stahlerzeugungsroute
definition:
  en: Process route by which the crude steel of the product was produced,
    identified by the ironmaking and steelmaking process combination; an
    electric arc furnace route whose metallic charge is predominantly direct
    reduced iron is reported as DRI-EAF, any other electric arc furnace route as
    EAF.
  de: Verfahrensroute, auf der der Rohstahl des Produkts erzeugt wurde, bezeichnet
    durch die Kombination aus Roheisen- und Stahlerzeugungsverfahren; eine
    Elektrolichtbogenofen-Route, deren metallischer Einsatz überwiegend aus
    direkt reduziertem Eisen besteht, wird als DRI-EAF angegeben, jede andere
    Elektrolichtbogenofen-Route als EAF.
