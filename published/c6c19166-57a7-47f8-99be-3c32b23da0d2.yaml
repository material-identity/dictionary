id: https://material-identity.eu/def/c6c19166-57a7-47f8-99be-3c32b23da0d2
isDefinedBy: https://material-identity.eu/
objectType: Value
value: importer
preferredName:
  en: Importer
  de: Einführer
definition:
  en: Natural or legal person established in the Union that places a product from a third country on the Union market.
  de: In der Union niedergelassene natürliche oder juristische Person, die ein Produkt aus einem Drittland auf dem Unionsmarkt in Verkehr bringt.
legalBasis:
  name: Regulation (EU) 2024/1781
  clause: Art. 2(44); Art. 11(b)
  uri: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
