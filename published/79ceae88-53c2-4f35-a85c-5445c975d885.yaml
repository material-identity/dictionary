id: https://material-identity.eu/def/79ceae88-53c2-4f35-a85c-5445c975d885
isDefinedBy: https://material-identity.eu/
objectType: Value
value: legitimateInterest
preferredName:
  en: Legitimate interest
  de: Berechtigtes Interesse
definition:
  en: Access category for a data element that is accessible only to natural or legal persons with a legitimate interest in accessing and processing it for the purposes set out in the applicable legal act, and to the Commission.
  de: Zugriffskategorie für ein Datenelement, das nur natürlichen oder juristischen Personen mit einem berechtigten Interesse am Zugang zu diesen Daten und an deren Verarbeitung für die im anwendbaren Rechtsakt festgelegten Zwecke sowie der Kommission zugänglich ist.
legalBasis:
  name: Regulation (EU) 2023/1542
  clause: Art. 77(2)(c)
  uri: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
