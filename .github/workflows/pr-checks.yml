# The required status check on main (ruleset context: "pr-checks", checklist item 12).
# Carries the entire integrity guarantee: validate.ts checks 1–7, the coverage-gated
# tests, SBOM + vulnerability scan, and check 8 (two-yes gate) as the final step —
# a step rather than a job so the single required context covers it (plan §4 M2 item 10).
# All actions pinned to full commit SHAs (supply-chain house rule; Dependabot bumps them).
name: pr-checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # checks 1, 6, 7 diff against the PR base

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: validate (checks 1–7)
        run: npm run validate -- --base "${{ github.event.pull_request.base.sha }}"

      - name: tests (coverage gate ≥85%)
        run: npm test

      - name: SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: vulnerability scan (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          # the action's default grype (0.110.0) mishandles .grype.yaml ignore rules
          # against this SBOM; 0.116.1 applies them correctly (verified locally)
          grype-version: v0.116.1

      - name: check 8 — two-yes gate (plan §5.3)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const added = files.filter(f => f.status === 'added' && f.filename.startsWith('published/'));
            if (added.length === 0) {
              core.info('No additions under published/ — two-yes gate not applicable.');
              return;
            }
            const res = await github.graphql(`
              query($owner: String!, $repo: String!, $num: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $num) {
                    closingIssuesReferences(first: 50) {
                      nodes { number labels(first: 100) { nodes { name } } }
                    }
                  }
                }
              }`, { owner, repo, num: pull_number });
            const nodes = res.repository.pullRequest.closingIssuesReferences.nodes ?? [];
            const accepted = nodes.filter(n => {
              const labels = n.labels.nodes.map(l => l.name);
              return labels.includes('type:dictionary-request') && labels.includes('state:accepted');
            });
            if (accepted.length === 0) {
              core.setFailed(
                `PR adds ${added.length} file(s) under published/ but closes no issue labeled ` +
                'type:dictionary-request + state:accepted. Yes #1 (triage acceptance) is missing — ' +
                'link the accepted request with "Closes #<n>" (plan §5.3).');
            } else {
              core.info(`Two-yes gate satisfied by issue(s): ${accepted.map(n => '#' + n.number).join(', ')}`);
            }
