# Expiry watch (#133): the security.txt `Expires` date and the PGP key lapse silently, so this
# runs the same validate checks daily with a 5-day horizon and keeps exactly one issue open
# while anything is due. No calendar entries — the tracker is the reminder. Read-only otherwise.
name: expiry-watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: expiry-watch
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: expiry checks (5-day horizon)
        id: check
        run: |
          set +e
          npm run validate -- --base HEAD --horizon-days 5 > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: open, refresh or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          title="Security contact expiry due within 5 days"
          number=$(gh issue list --state open --label type:chore --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "0" ]; then
            [ -n "$number" ] && gh issue close "$number" --comment "Renewed: the expiry checks pass again."
            exit 0
          fi
          body=$(printf 'The daily expiry watch found something due or already lapsed. Renew it in place (security.txt `Expires`, or extend and republish the key in `.well-known/pgp-security.asc`); the issue closes itself on the next green run.\n\n```\n%s\n```\n' "$(grep -E '^(FAIL|  )' report.txt)")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label type:chore --body "$body"
          fi
