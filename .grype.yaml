# Scoped ignores for the pr-checks vulnerability gate (grype reads this file automatically).
#
# Version-scoped, not per-CVE (#68): every finding below lives in the Go toolchain
# embedded in esbuild's prebuilt binary (tsx → esbuild, a dev-time bundler;
# validate/build are offline and never feed it untrusted input), pinned at
# esbuild 0.28.1 as of 2026-08-17. Per-CVE entries (#66) broke again within two
# days when the vulnerability DB reclassified four "Unknown"-severity findings
# to High — enumerating IDs cannot keep up with reclassification. Matching by
# package+version instead (no `vulnerability` field) covers every CVE against
# these exact versions, known now or found later, and stops applying the moment
# esbuild bumps either one — so a genuinely new problem at a new version still
# surfaces. DELETE an entry once esbuild ships a fixed version of that module
# (ratchet rule, plan §2.7); check manually — Dependabot is disabled (#66).
ignore:
  - package:
      type: go-module
      name: stdlib
      version: go1.26.4
  - package:
      type: go-module
      name: golang.org/x/text
      version: v0.38.0
