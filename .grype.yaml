# Scoped ignores for the pr-checks vulnerability gate (grype reads this file automatically).
#
# All findings live in the Go toolchain embedded in esbuild's prebuilt binary
# (tsx → esbuild, a dev-time bundler; validate/build are offline and never feed it
# untrusted input). As of 2026-08-15 the latest esbuild (0.28.2) embeds go1.26.5 —
# still short of the go1.26.6 fix line, which has no stable release yet (only
# 1.27.0-rc.3). DELETE each entry once an esbuild release embeds a fixed Go
# (ratchet rule, plan §2.7); check manually — Dependabot is disabled (#66).
ignore:
  - vulnerability: GO-2026-4970 # Go stdlib go1.26.4, fixed in 1.26.5
    package:
      type: go-module
      name: stdlib
  - vulnerability: GO-2026-5970 # golang.org/x/text v0.38.0, fixed in 0.39.0
    package:
      type: go-module
      name: golang.org/x/text
  - vulnerability: GO-2026-5026 # Go stdlib go1.26.4, fixed in 1.26.6
    package:
      type: go-module
      name: stdlib
  - vulnerability: GO-2026-5942 # Go stdlib go1.26.4, fixed in 1.26.6
    package:
      type: go-module
      name: stdlib
